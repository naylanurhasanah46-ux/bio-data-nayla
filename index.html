<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayla's Cute Biodata ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#FFEAF5;
  background-image: radial-gradient(#FFB6D9 2px, transparent 2px);
  background-size: 30px 30px;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  font-family:'Quicksand',sans-serif;
}
.card{
  background:white;
  width:100%;max-width:380px;
  border-radius:32px;
  border:4px solid #333;
  box-shadow: 8px 8px 0px #333;
  overflow:hidden;
}
.header{
  background:#FFD6E7;
  text-align:center;
  padding:28px 20px 20px;
  border-bottom:4px solid #333;
  position:relative;
}
.avatar-wrap{
  width:110px;height:110px;
  margin:0 auto 14px;
  background:#A0E7E5;
  border:4px solid #333;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:50px;
  box-shadow: 4px 4px 0 #333;
}
.header h1{font-family:'Fredoka',sans-serif;font-size:23px;color:#333;line-height:1.1;}
.header .tag{display:inline-block;background:#333;color:white;font-family:'Fredoka',sans-serif;font-size:12px;padding:4px 14px;border-radius:20px;margin-top:8px;}
.list{padding:18px}
.bubble{display:flex;align-items:center;gap:12px;border:3px solid #333;border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow: 4px 4px 0 #333;}
.b1{background:#FFF5AB} .b2{background:#C4F4FF} .b3{background:#FFD6E7} .b4{background:#D5FFCF} .b5{background:#E8D5FF}
.icon-box{width:44px;height:44px;background:white;border:3px solid #333;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.text b{font-family:'Fredoka',sans-serif;font-size:11px;color:#333;opacity:0.6;letter-spacing:0.8px;}
.text span{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;color:#333;display:block;margin-top:1px;}
.footer{text-align:center;padding:4px 18px 18px;font-family:'Fredoka',sans-serif;font-size:11px;color:#333;opacity:0.6;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div style="position:absolute;top:12px;left:16px">🌷</div>
    <div style="position:absolute;top:10px;right:18px">✨</div>
    <div class="avatar-wrap">🐰</div>
    <h1>Nayla Nur<br>Hasanah</h1>
    <div class="tag">★ 24 Feb 2011 ★</div>
  </div>
  <div class="list">
    <div class="bubble b1"><div class="icon-box">👧</div><div class="text"><b>NAMA AKU</b><span>Nayla Nur Hasanah</span></div></div>
    <div class="bubble b2"><div class="icon-box">🏡</div><div class="text"><b>TINGGAL DI</b><span>Kp. Pereng</span></div></div>
    <div class="bubble b3"><div class="icon-box">🎀</div><div class="text"><b>SEKOLAH KU</b><span>SMK Banjar Asri</span></div></div>
    <div class="bubble b4"><div class="icon-box">🎂</div><div class="text"><b>ULTAH KU</b><span>24 February 2011</span></div></div>
    <div class="bubble b5"><div class="icon-box">🏸</div><div class="text"><b>HOBI KU</b><span>Olah Raga</span></div></div>
  </div>
  <div class="footer">♡ made with love for nayla ♡</div>
</div>
</body>
</html>
